<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f1e8;font-family:Arial,sans-serif;color:#172018;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dfe3dc;border-radius:18px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#55705c;">Student Reg</p>
                <h1 style="margin:0 0 14px;font-size:28px;line-height:1.2;">Confirm your event account</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#5c655e;">
                  Verify this Gmail address to continue to the event registration form.
                </p>
                <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#19683b;color:#ffffff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:10px;">
                  Confirm Gmail and continue
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#7b837d;">
                  This link is intended only for the person who created the account.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
